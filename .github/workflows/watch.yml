# The outside watch of Fleet's production environment (EmDash Fleet app plan,
# Operations, Alerts; alerts A20, A21, A44 and A53; pre-mortem PM-AP-31;
# tracker APC-030). GitHub runs a schedule from the default branch only, so
# this file runs from main, and a co-founder pushes to main when a change is
# ready (emdashfleet_app_plan.md D31 (HR-162); README).
#
# Two separate steps, each through scripts/watch-check.sh:
#   healthz        https://app.emdashfleet.com/healthz with the Bearer token
#                  WATCH_CHECKIN_TOKEN, which also writes the cron_checkin row
#                  watch.yml that alert A53 reads; failing posts A21, or A20
#                  when both attempts answer 503 cron_stale;
#   landing page   https://emdashfleet.com/; failing posts A44.
# A check fails on a status other than 200 or on no answer within 10 seconds
# and is repeated once 5 minutes later; when both attempts fail the step posts
# <!channel> to #fleet-alerts through the Incoming Webhook
# SLACK_WATCH_WEBHOOK_URL and exits non-zero, so the run fails and GitHub
# emails the co-founder who last changed the schedule. Every later failing run
# posts again; no recovery message is posted.
#
# The landing page step runs after a failed healthz step (`!cancelled()`), so
# an outage of one never hides the other. Each secret is the env: of the one
# step that uses it, no run: block holds an expression, the repository is
# public and the log holds only each URL's HTTP status. The token only reads
# this repository; the scripts folder is fetched with the runner's own git,
# without a token, and the job runs no action. SP-VN-07 (f) records whether a
# webhook message notifies with <!channel>; until then the failed-run email
# and A53 back the post.
#
# The job references the GitHub environment production (HR-221). The two
# secrets above are secrets of that environment, which limits its deployment
# branches to main, and no repository secret holds them: a run of any other
# branch is not allowed to deploy to the environment and so does not get
# them. GitHub runs a schedule from main, which the rule allows (README,
# Secrets and environments).
name: watch

on:
  schedule:
    # Every 15 minutes, at minutes 7,22,37,52: GitHub documents the start of every
    # hour as a high-load time at which a scheduled run can be delayed or
    # dropped and advises "a different time of the hour"
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule),
    # so no minute is 0. The two workflows use different minutes.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run of this workflow at a time: a manual dispatch inside the window of a
# run in progress, or two delayed scheduled runs that start together, would
# otherwise post <!channel> twice and write two check-ins. cancel-in-progress
# is false, so a run in progress is never cancelled; a newer run waits, and
# GitHub keeps at most one run pending in the group and replaces an older
# pending run by the newer one, which suits a live probe (workflow syntax,
# concurrency:
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax).
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # The environment that holds the two secrets of this job and limits the
    # branches that may use them (HR-221).
    environment: production
    timeout-minutes: 15
    steps:
      # The scripts folder of the commit this run is for, fetched with the
      # runner's own git instead of an action, so no third-party code runs in
      # the job that holds the secrets (security audit of 2026-11-21, Watch
      # S12). The repository is public, so the fetch needs no token; GitHub
      # serves a fetch by commit SHA, which actions/checkout uses as well.
      - run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch -q --no-tags --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD -- scripts

      - name: healthz
        env:
          WATCH_URL: https://app.emdashfleet.com/healthz
          WATCH_TOKEN: ${{ secrets.WATCH_CHECKIN_TOKEN }}
          WATCH_WEBHOOK: ${{ secrets.SLACK_WATCH_WEBHOOK_URL }}
          WATCH_ENVIRONMENT: production
        run: bash scripts/watch-check.sh healthz

      - name: landing page
        if: ${{ !cancelled() }}
        env:
          WATCH_URL: https://emdashfleet.com/
          WATCH_WEBHOOK: ${{ secrets.SLACK_WATCH_WEBHOOK_URL }}
          WATCH_ENVIRONMENT: production
        run: bash scripts/watch-check.sh landing
